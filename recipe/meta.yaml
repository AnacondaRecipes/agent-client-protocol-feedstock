{% set name = "agent-client-protocol" %}
{% set version = "1.0.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  - url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-','_') }}-{{ version }}.tar.gz
    sha256: 24914d9996aaeeb08931191382d0ca1028b83743e2797cc05ded39b3bb754425

build:
  skip: true  # [py<310]
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check

requirements:
  host:
    - python
    - pdm-backend
    - pip
  run:
    - python
    - pydantic >=2.7
    - pydantic-core >=2.18.1
  run_constrained:
    # logfire
    - logfire >=0.14
    - opentelemetry-sdk >=1.28.0
    # Experimental remote transports (Streamable HTTP + WebSocket), client + server.
    - httpx2 >=2.12
    - websockets >=12.0
    - starlette >=0.49.3

{% set skip_tests = [
  "--ignore=tests/test_gen_all.py",
] %}

test:
  source_files:
    - tests
    - examples  # used by test: tests/test_rpc.py::test_spawn_agent_process_roundtrip
    - scripts
  imports:
    - acp
  requires:
    - pip
    - pytest >=7.2.0
    - pytest-asyncio >=0.21.0
    - uvicorn >=0.30
    - ruff >=0.11.5
    - httpx2 >=2.12
    - h2
    - websockets >=12.0
    - starlette >=0.49.3
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
    - pytest --import-mode=importlib -vv {{ skip_tests | join(" ")}} tests

about:
  home: https://github.com/agentclientprotocol/python-sdk
  summary: Python SDK for ACP clients and agents.
  description: |
    Build ACP-compliant agents and clients in Python with generated schema
    models, asyncio transports, helper builders, and runnable demos.
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE
  dev_url: https://github.com/agentclientprotocol/python-sdk
  doc_url: https://agentclientprotocol.github.io/python-sdk

extra:
  recipe-maintainers:
    - davidbrochart
