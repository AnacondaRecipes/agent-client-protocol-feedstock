{% set name = "agent-client-protocol" %}
{% set version = "0.9.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  - url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-','_') }}-{{ version }}.tar.gz
    sha256: f744c48ab9af0f0b4452e5ab5498d61bcab97c26dbe7d6feec5fd36de49be30b

build:
  skip: true  # [py<310]
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check

requirements:
  host:
    - python
    - pdm-backend
    - pip
  run:
    - python
    - pydantic >=2.7
  run_constrained:
    # logfire
    - logfire >=0.14
    - opentelemetry-sdk >=1.28.0

{% set skip_tests = "" %}
# fails on Windows due to CRLF vs. LF line endings
# E  AssertionError: assert 71682 == (71680 + 1)
{% set skip_tests = skip_tests + " --deselect=tests/real_user/test_stdio_limits.py::test_spawn_stdio_transport_custom_limit_handles_large_line" %}  # [win]

test:
  source_files:
    - tests
    - examples  # used by test: tests/test_rpc.py::test_spawn_agent_process_roundtrip
  imports:
    - acp
  requires:
    - pip
    - pytest >=7.2.0
    - pytest-asyncio >=0.21.0
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
    - pytest --import-mode=importlib -vv tests

about:
  home: https://github.com/agentclientprotocol/python-sdk
  summary: Python SDK for ACP clients and agents.
  description: |
    Build ACP-compliant agents and clients in Python with generated schema
    models, asyncio transports, helper builders, and runnable demos.
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE
  dev_url: https://github.com/agentclientprotocol/python-sdk
  doc_url: https://agentclientprotocol.github.io/python-sdk

extra:
  recipe-maintainers:
    - davidbrochart
